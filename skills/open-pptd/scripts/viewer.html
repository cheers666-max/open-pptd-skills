<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PPTD Viewer</title>
<style>
  :root {
    --bg: #17191d;
    --bg2: #202329;
    --panel: #262a31;
    --line: #3a3f49;
    --ink: #e8eaf0;
    --muted: #9aa1ad;
    --accent: #4da3ff;
    --warn: #e0a83e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  /* ---------- 顶栏 ---------- */
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--bg2);
    border-bottom: 1px solid var(--line); flex: none;
  }
  #topbar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  #topbar button:hover { border-color: var(--accent); }
  #topbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #deck-name { font-weight: 600; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #deck-path { color: var(--muted); font-size: 11px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }
  #page-ind { color: var(--muted); min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
  #btn-warn { color: var(--warn); }
  #status-line { color: var(--muted); font-size: 12px; }

  /* ---------- 主布局 ---------- */
  #layout { display: flex; flex: 1; min-height: 0; }
  #thumb-strip {
    width: 196px; flex: none; overflow-y: auto; padding: 12px 10px;
    background: var(--bg2); border-right: 1px solid var(--line);
  }
  #thumb-strip.hidden { display: none; }
  .thumb {
    position: relative; width: 160px; height: 90px; margin: 0 auto 14px;
    background: #fff; cursor: pointer; overflow: hidden;
    border: 2px solid transparent; border-radius: 3px; flex: none;
  }
  .thumb:hover { border-color: var(--line); }
  .thumb.current { border-color: var(--accent); }
  .thumb .page-no {
    position: absolute; left: 2px; top: 2px; z-index: 5;
    background: rgb(0 0 0 / 55%); color: #fff; font-size: 10px;
    padding: 0 5px; border-radius: 3px;
  }
  .thumb .slide { transform: scale(0.16667); transform-origin: 0 0; }
  #stage {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
    background:
      radial-gradient(circle at center, #23262d 0, #1a1c21 75%);
    overflow: hidden;
  }
  #scaler { position: relative; width: 960px; height: 540px; }
  #slide-mount { position: absolute; inset: 0; }
  #notes-bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
    background: rgb(23 25 29 / 92%); border-top: 1px solid var(--line);
    padding: 8px 18px; color: var(--muted); font-size: 12px;
    max-height: 30%; overflow-y: auto; white-space: pre-wrap;
  }
  #hint {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: var(--muted); text-align: center; line-height: 2;
  }
  #hint kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }

  /* ---------- 弹层 ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / 55%);
    display: flex; align-items: center; justify-content: center;
  }
  #overlay[hidden] { display: none; }
  #overlay-panel {
    width: min(720px, 90vw); max-height: 80vh; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 48px rgb(0 0 0 / 45%);
  }
  #overlay-head {
    display: flex; align-items: center; padding: 12px 16px;
    border-bottom: 1px solid var(--line); font-weight: 600;
  }
  #overlay-body { padding: 12px 16px; overflow-y: auto; font-size: 12.5px; }
  #overlay-body .w-row { padding: 5px 0; border-bottom: 1px dashed var(--line); }
  #overlay-body .w-row:last-child { border-bottom: none; }
  .w-page { color: var(--accent); font-weight: 600; }
  .w-msg { color: var(--ink); }
  .w-kind { color: var(--warn); }

  /* ---------- slide 渲染 ---------- */
  .slide {
    position: absolute; inset: 0; overflow: hidden;
    background: #fff; color: #000;
    font-family: MiSans, -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 18px; line-height: 1;
  }
  .el { position: absolute; }
  .el-text p, .el-cell p { margin: 0; }
  .el-text ul, .el-text ol { margin: 0; padding-left: 1.4em; }
  .el img { -webkit-user-drag: none; }
  .el-placeholder {
    border: 1.5px dashed #c0392b; background: rgb(192 57 43 / 7%);
    color: #c0392b; font-size: 12px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 4px; overflow: hidden;
  }
  .el-bg { position: absolute; inset: 0; }

  /* ---------- 干净模式（?bare=1） ---------- */
  body.bare-mode #topbar { display: none; }
  body.bare-mode #thumb-strip { display: none; }
  body.bare-mode #hint { display: none; }
  body.bare-mode #notes-bar { display: none; }
  body.bare-mode #stage { background: #fff; }
</style>
</head>
<body>
  <header id="topbar">
    <button id="btn-open" title="选择包含 .pptd 与 pages/、media/ 的项目文件夹">📂 打开文件夹</button>
    <span id="deck-name">未加载演示文稿</span>
    <span id="deck-path"></span>
    <span class="spacer"></span>
    <button id="btn-thumbs" title="缩略图栏">▤ 缩略图</button>
    <button id="btn-fit" class="active" title="适应窗口">适应</button>
    <button id="btn-100" title="100%">100%</button>
    <button id="btn-150" title="150%">150%</button>
    <span id="page-ind">0 / 0</span>
    <button id="btn-notes" title="显示演讲者备注">🗒 备注</button>
    <button id="btn-warn" title="渲染告警" hidden>⚠ <span id="warn-count">0</span></button>
    <button id="btn-fullscreen" title="全屏 (F)">⛶</button>
    <button id="btn-png" title="当前页导出 PNG">📷 PNG</button>
    <button id="btn-html" title="导出 HTML 文件夹（每页一个自包含 .html，图片内嵌，ZIP 下载）">📦 HTML</button>
    <span id="status-line"></span>
  </header>

  <div id="layout">
    <aside id="thumb-strip"></aside>
    <main id="stage">
      <div id="scaler"><div id="slide-mount"></div></div>
      <div id="hint">
        <b>PPTD Viewer</b> — 本地 PPTD 目检工具（绝对定位 HTML5 渲染）<br />
        点击 <kbd>📂 打开文件夹</kbd> 选择 PPTD 项目目录（含 .pptd、pages/、media/）<br />
        <kbd>←</kbd><kbd>→</kbd> 翻页 &nbsp; <kbd>F</kbd> 全屏 &nbsp; <kbd>1</kbd> 适应窗口
      </div>
      <div id="notes-bar" hidden></div>
    </main>
  </div>

  <div id="overlay" hidden>
    <div id="overlay-panel">
      <div id="overlay-head"><span id="overlay-title">告警</span><span class="spacer"></span>
        <button id="overlay-close">关闭</button>
      </div>
      <div id="overlay-body"></div>
    </div>
  </div>

  <input type="file" id="dir-picker" webkitdirectory multiple hidden />

    return node;
  }

  function renderText(elem, deck) {
    const node = baseEl(elem, deck);
    node.className = "el el-text";
    const c = elem.content || {};
    const st = effectiveTextStyle(c, deck);
    const [hAlign, vAlign] = c.align || ["left", "top"];

    Object.assign(node.style, {
      fontSize: st.fontSize !== undefined ? `${st.fontSize}px` : undefined,
      color: st.color !== undefined ? cssColor(st.color, deck) : undefined,
      fontWeight: st.bold ? "bold" : undefined,
      fontStyle: st.italic ? "italic" : undefined,
      letterSpacing: st.letterSpacing !== undefined ? `${st.letterSpacing}px` : undefined,
      lineHeight: st.lineHeightPx !== undefined ? `${st.lineHeightPx}px` : st.lineHeight !== undefined ? String(st.lineHeight) : undefined,
      fontFamily: fontFamilyCss(st.fontFamily),
    });
    if (st.backgroundColor !== undefined) node.style.backgroundColor = cssColor(st.backgroundColor, deck);
    if (c.textDirection === "vertical") node.style.writingMode = "vertical-rl";
    if (c.wrap === false) node.style.whiteSpace = "nowrap";
    if (c.gradient) {
      Object.assign(node.style, {
        backgroundImage: fillToCss(c.gradient, deck),
        WebkitBackgroundClip: "text",
        backgroundClip: "text",
        color: "transparent",
        WebkitTextFillColor: "transparent",
      });
    }
    Object.assign(node.style, shadowToCss(c.shadow, deck, true));

    let rich = resolveRichTokens(c.text || "", deck);
    if (!rich.includes("<")) {
      // 纯文本速记：按行包 <p>
      rich = rich.split("\n").map((line) => `<p>${escapeHtml(line)}</p>`).join("");
    }
    const textAlign = hAlign === "distributed" ? "justify" : hAlign;
    node.innerHTML =
      `<div style="display:table;width:100%;height:100%">` +
      `<div style="display:table-cell;vertical-align:${vAlign};text-align:${textAlign};` +
      (st.marginTop ? `padding-top:${st.marginTop}px;` : "") +
      (hAlign === "distributed" ? "text-align-last:justify;" : "") +
      `">${rich}</div></div>`;
    return node;
  }

  function renderShape(elem, deck) {
    const [x, y, w, h] = elem.bounds;
    const adj = elem.adjustments;
    const name = elem.shapeName;
    const fillCss = fillToCss(elem.fill, deck);
    const borderCss = borderToCss(elem.border, deck);

    // rect / roundRect / ellipse：div + CSS（边框完美内嵌）
    if (name === "rect" || name === "roundRect" || name === "ellipse") {
      const node = baseEl(elem, deck);
      Object.assign(node.style, {
        background: fillCss,
        ...borderCss,
      });
      if (name === "ellipse") node.style.borderRadius = "50%";
      if (name === "roundRect") {
        const r = ((adj?.[0] ?? 16667) / 100000) * Math.min(w, h);
        node.style.borderRadius = `${r}px`;
      }
      Object.assign(node.style, shadowToCss(elem.shadow, deck, false));
      return node;
    }

    // 其余形状 / custom：SVG
    const node = baseEl(elem, deck);
    let pathD, vb = [100, 100];
    if (name === "custom" && elem.path && elem.viewBox) {
      pathD = elem.path;
      vb = elem.viewBox;
    } else if (SHAPE_PATHS[name]) {
      pathD = SHAPE_PATHS[name](w, h, adj);
    } else {
      warn(deck, "shape", `未知形状 shapeName="${name}"，已降级占位显示`);
      return placeholder(elem, deck, `未知形状: ${name}`);
    }
    const svg = svgEl("svg", { viewBox: `0 0 ${vb[0]} ${vb[1]}`, "preserveAspectRatio": "none" });
    Object.assign(svg.style, {
      position: "absolute", inset: "0", width: "100%", height: "100%", overflow: "visible",
    });
    const defs = svgEl("defs", {});
    const uid = `g${uidSeq++}`;
    const path = svgEl("path", { d: pathD });
    if (elem.fill?.type === "gradient") {
      defs.appendChild(svgGradient(elem.fill, deck, uid));
      path.setAttribute("fill", `url(#${uid})`);
    } else if (fillCss) {
      path.setAttribute("fill", fillCss);
    }
    if (elem.border) {
      const b = elem.border;
      const sw = (b.width ?? 1) * (vb[0] / w); // viewBox 归一化后的线宽
      path.setAttribute("stroke", cssColor(b.color || "#000000", deck));
      path.setAttribute("stroke-width", String(sw));
      path.setAttribute("stroke-dasharray", b.style === "dash" ? `${sw * 4} ${sw * 3}` : b.style === "dot" ? `${sw} ${sw * 2}` : "none");
    }
    svg.appendChild(defs);
    svg.appendChild(path);
    if (elem.shadow) svg.style.filter = shadowToCss(elem.shadow, deck, false).filter;
    node.appendChild(svg);
    return node;
  }

  const ARROW_MARKERS = {
    arrow: { d: "M0 0L10 5L0 10z", refX: 9 },
    stealth: { d: "M0 0L10 5L0 10L2.5 5z", refX: 9 },
    diamond: { d: "M5 0L10 5L5 10L0 5z", refX: 5 },
    oval: { d: "M7 0a3 5 0 1 0 0.01 0z", refX: 7 },
  };

  function renderLine(elem, deck) {
    const [x, y, w, h] = elem.bounds;
    const vb = elem.viewBox || [w, h];
    const pts = String(elem.points || "").trim().split(/\s+/).map((p) => p.split(",").map(Number));
    if (pts.length < 2) return placeholder(elem, deck, "line: points 无效");
    const border = elem.border || {};
    const arrows = elem.arrow || border.arrow || [null, null];

    let d;
    const P = (p) => `${p[0]},${p[1]}`;
    if (elem.curve === "sharp") {
      d = `M${P(pts[0])} ` + pts.slice(1).map((p) => `L${P(p)}`).join(" ");
    } else if (elem.curve === "smooth" && pts.length >= 4) {
      // 首尾为端点，中间为贝塞尔控制点（3 点一组）
      d = `M${P(pts[0])}`;
      let i = 1;
      while (i + 2 < pts.length) { d += ` C${P(pts[i])} ${P(pts[i + 1])} ${P(pts[i + 2])}`; i += 3; }
      if (i < pts.length - 1) d += ` S${P(pts[i])} ${P(pts[pts.length - 1])}`;
      else if (i === pts.length - 1) d += ` L${P(pts[pts.length - 1])}`;
    } else {
      d = `M${P(pts[0])} ` + pts.slice(1).map((p) => `L${P(p)}`).join(" ");
    }

    const node = baseEl(elem, deck);
    const svg = svgEl("svg", { viewBox: `0 0 ${vb[0]} ${vb[1]}`, "preserveAspectRatio": "none" });
    Object.assign(svg.style, {
      position: "absolute", inset: "0", width: "100%", height: "100%", overflow: "visible",
    });
    const defs = svgEl("defs", {});
    const path = svgEl("path", { d });
    const stroke = cssColor(border.color || "#000000", deck);
    const swPx = border.width ?? 1;
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", stroke);
    path.setAttribute("stroke-width", String(swPx * (vb[0] / w)));
    path.setAttribute("stroke-linejoin", "round");
    path.setAttribute("stroke-linecap", "round");
    if (border.style === "dash") path.setAttribute("stroke-dasharray", `${swPx * 4} ${swPx * 3}`);
    if (border.style === "dot") path.setAttribute("stroke-dasharray", `${swPx} ${swPx * 2}`);

    for (const [idx, at] of arrows.entries()) {
      if (!at || !ARROW_MARKERS[at]) continue;
      const mk = ARROW_MARKERS[at];
      const marker = svgEl("marker", {
        id: `m${idx}-${uidSeq++}`,
        viewBox: "0 0 10 10", refX: String(mk.refX), refY: "5",
        markerWidth: "7", markerHeight: "7",
        markerUnits: "strokeWidth",
        orient: idx === 0 ? "auto-start-reverse" : "auto",
      });
      marker.appendChild(svgEl("path", { d: mk.d, fill: stroke }));
      defs.appendChild(marker);
      path.setAttribute(idx === 0 ? "marker-start" : "marker-end", `url(#${marker.id})`);
    }
    svg.appendChild(defs);
    svg.appendChild(path);
    if (elem.shadow) svg.style.filter = shadowToCss(elem.shadow, deck, false).filter;
    node.appendChild(svg);
    return node;
  }

  function renderImage(elem, deck) {
    const [x, y, w, h] = elem.bounds;
    const rel = normalizeRel(elem.src);
    const src = deck.images[rel] || elem.src;
    const node = baseEl(elem, deck);
    Object.assign(node.style, {
      overflow: "hidden",
      ...borderToCss(elem.border, deck),
      ...shadowToCss(elem.shadow, deck, false),
    });

    const missing = !src || (!deck.images[rel] && !/^(https?:|data:)/.test(elem.src));
    if (missing) {
      warn(deck, "media", `图片缺失: ${elem.src}`);
      return placeholder(elem, deck, `图片缺失: ${elem.src}`);
    }

    const fit = elem.fit?.mode || "cover";
    const crop = elem.crop || {};
    const cropShape = elem.cropShape;

    if (cropShape) {
      // 形状裁剪：roundRect / ellipse 用 CSS clip-path；custom 用 SVG
      if (cropShape.shapeName === "roundRect") {
        const r = ((cropShape.adjustments?.[0] ?? 16667) / 100000) * Math.min(w, h);
        node.style.clipPath = `inset(0 round ${r}px)`;
      } else if (cropShape.shapeName === "ellipse") {
        node.style.clipPath = "ellipse(50% 50% at 50% 50%)";
      } else if (cropShape.shapeName === "custom" && cropShape.path) {
        const svg = svgEl("svg", { viewBox: `0 0 ${cropShape.viewBox[0]} ${cropShape.viewBox[1]}`, "preserveAspectRatio": "none" });
        Object.assign(svg.style, { position: "absolute", inset: "0", width: "100%", height: "100%" });
        const cp = svgEl("clipPath", { id: `cp${uidSeq++}` });
        cp.appendChild(svgEl("path", { d: cropShape.path }));
        svg.appendChild(cp);
        const image = svgEl("image", {
          href: src, width: "100%", height: "100%", preserveAspectRatio:
            fit === "cover" ? "xMidYMid slice" : fit === "contain" ? "xMidYMid meet" : "none",
          "clip-path": `url(#${cp.id})`,
        });
        svg.appendChild(image);
        node.appendChild(svg);
        return node;
      }
      // 其他 cropShape 暂不支持
      warn(deck, "shape", `cropShape "${cropShape.shapeName}" 暂不支持，按矩形裁剪`);
    }

    const img = el("img", null, {
      position: "absolute", width: "100%", height: "100%",
      objectFit: fit,
    });
    img.src = src;

    const l = crop.left ?? 0, t = crop.top ?? 0, r = crop.right ?? 0, b = crop.bottom ?? 0;
    if (l || t || r || b) {
      // crop：先按子矩形放大平移；img onload 后用自然尺寸精确修正
      const sx = 1 - l - r, sy = 1 - t - b;
      const apply = () => {
        const W = img.naturalWidth, H = img.naturalHeight;
        if (!W || !H) return;
        const Wp = W * sx, Hp = H * sy;
        const scale = fit === "cover" ? Math.max(w / Wp, h / Hp) : Math.min(w / Wp, h / Hp);
        const dw = W * scale, dh = H * scale;
        Object.assign(img.style, {
          width: `${dw}px`, height: `${dh}px`, objectFit: "fill",
          left: `${(w - dw) / 2 - l * dw / sx}px`,
          top: `${(h - dh) / 2 - t * dh / sy}px`,
        });
      };
      img.addEventListener("load", apply);
      if (img.complete && img.naturalWidth) apply();
    }
    node.appendChild(img);
    return node;
  }

  /* ---------- table ---------- */

  function cellStyleFor(table, rowIdx, colIdx, dataRowIdx, deck) {
    // 继承链：cell 内联 > textStyle > 行列类别 > bodyStyles > cellStyle > 默认
    const st = table.style && typeof table.style === "object" ? table.style
      : deck.manifest.theme?.tableStyles?.[(table.style || "$default").slice(1)] || {};
    const rowCount = table.rows.length;
    const colCount = table.columnWidths.length;
    const cat = [];
    if (rowIdx === 0) cat.push(st.firstRowStyle);
    if (rowIdx === rowCount - 1) cat.push(st.lastRowStyle);
    if (colIdx === 0) cat.push(st.firstColumnStyle);
    if (colIdx === colCount - 1) cat.push(st.lastColumnStyle);
    const body = st.bodyStyles?.[((dataRowIdx % (st.bodyStyles?.length || 1)) + (st.bodyStyles?.length || 1)) % (st.bodyStyles?.length || 1)];
    if (st.rowOverColumn !== false) return Object.assign({}, st.cellStyle, body, ...cat.reverse());
    return Object.assign({}, st.cellStyle, body, ...cat);
  }

  function cellBorderCss(border, deck) {
    // BorderSpec: null / Border / [上下, 左右] / [上, 右, 下, 左]
    if (!border) return {};
    const one = (b) => b
      ? `${b.width ?? 1}px ${b.style === "dash" ? "dashed" : b.style === "dot" ? "dotted" : "solid"} ${cssColor(b.color || "#000000", deck)}`
      : "none";
    if (Array.isArray(border)) {
      if (border.length === 2) {
        return { borderTop: one(border[0]), borderBottom: one(border[0]), borderLeft: one(border[1]), borderRight: one(border[1]) };
      }
      return { borderTop: one(border[0]), borderRight: one(border[1]), borderBottom: one(border[2]), borderLeft: one(border[3]) };
    }
    return { border: one(border) };
  }

  function renderTable(elem, deck) {
    const [x, y, w, h] = elem.bounds;
    const node = baseEl(elem, deck);
    node.className = "el";
    Object.assign(node.style, { ...shadowToCss(elem.shadow, deck, false) });

    const tbl = el("table", null, {
      width: "100%", height: "100%", borderCollapse: "separate", borderSpacing: "0",
      tableLayout: "fixed",
    });
    if (elem.fill) node.style.background = fillToCss(elem.fill, deck);

    const colgroup = el("colgroup");
    for (const cw of elem.columnWidths || []) {
      colgroup.appendChild(el("col", null, { width: `${cw * 100}%` }));
    }
    tbl.appendChild(colgroup);

    const rowCount = elem.rows.length;
    elem.rows.forEach((cells, rIdx) => {
      const tr = el("tr", null, { height: `${(elem.rowHeights?.[rIdx] ?? 1 / rowCount) * 100}%` });
      let col = 0; // 当前实际列（合并单元格跳过数组位）
      for (const cell of cells) {
        const td = el("td", null, { padding: "0", verticalAlign: "middle", textAlign: "center" });
        if (cell.rowSpan > 1) td.rowSpan = cell.rowSpan;
        if (cell.colSpan > 1) td.colSpan = cell.colSpan;
        // 单元格样式继承链（含 textStyle 引用）
        const catStyle = cellStyleFor(elem, rIdx, col, rIdx, deck);
        col += cell.colSpan || 1;
        const textBase = typeof cell.textStyle === "string" && cell.textStyle.startsWith("$")
          ? deck.manifest.theme?.textStyles?.[cell.textStyle.slice(1)] || {}
          : {};
        const merged = Object.assign({}, catStyle, textBase, cell);
        if (merged.fill) td.style.background = fillToCss(merged.fill, deck);
        Object.assign(td.style, cellBorderCss(merged.border, deck));
        if (merged.align) td.style.textAlign = merged.align[0];
        if (merged.align) td.style.verticalAlign = merged.align[1] === "middle" ? "middle" : merged.align[1] === "bottom" ? "bottom" : "top";
        Object.assign(td.style, {
          fontSize: merged.fontSize !== undefined ? `${merged.fontSize}px` : undefined,
          color: merged.color !== undefined ? cssColor(merged.color, deck) : undefined,
          fontWeight: merged.bold ? "bold" : undefined,
          fontStyle: merged.italic ? "italic" : undefined,
          fontFamily: fontFamilyCss(merged.fontFamily),
          lineHeight: merged.lineHeightPx !== undefined ? `${merged.lineHeightPx}px` : merged.lineHeight !== undefined ? String(merged.lineHeight) : undefined,
          letterSpacing: merged.letterSpacing !== undefined ? `${merged.letterSpacing}px` : undefined,
        });
        if (merged.backgroundColor !== undefined) td.style.backgroundColor = cssColor(merged.backgroundColor, deck);
        let rich = resolveRichTokens(cell.text || "", deck);
        if (!rich.includes("<")) rich = rich.split("\n").map((ln) => `<p>${escapeHtml(ln)}</p>`).join("");
        td.innerHTML = `<div class="el-cell">${rich}</div>`;
        tr.appendChild(td);
      }
      tbl.appendChild(tr);
    });
    node.appendChild(tbl);
    return node;
  }

  function renderIconPlaceholder(elem, deck) {
    warn(deck, "icon", `图标 "${elem.iconName}" 暂不支持渲染（离线无 Font Awesome 字体），已占位`);
    return placeholder(elem, deck, `icon: ${elem.iconName}`);
  }

  function renderChartPlaceholder(elem, deck) {
    const types = (elem.series || []).map((s) => s.type).join(", ");
    warn(deck, "chart", `图表（${types}）暂不支持渲染，已占位`);
    return placeholder(elem, deck, `chart: ${types || "?"}\n（图表渲染未实现）`);
  }

  /* ---------- 页面渲染 ---------- */

  let gSeq = 0;

  function renderPage(page, deck) {
    const [W, H] = deck.manifest.size || [960, 540];
    const slide = el("div", "slide", { width: `${W}px`, height: `${H}px` });
    slide.dataset.pageType = page.pageType || "";

    const bg = page.background || { type: "solid", color: "#FFFFFF" };
    if (bg.type === "image") {
      const bgNode = el("div", "el-bg");
      bgNode.style.background = fillToCss(bg, deck);
      if (bg.opacity !== undefined) bgNode.style.opacity = bg.opacity;
      slide.appendChild(bgNode);
    } else {
      slide.style.background = fillToCss(bg, deck) || "#FFFFFF";
    }

    for (const elem of page.elements || []) {
      try {
        const renderer = renderers[elem.elementType];
        if (!renderer) {
          warn(deck, "element", `未知元素类型 "${elem.elementType}" (${elem.elementId})`);
          slide.appendChild(placeholder(elem, deck, `未知元素: ${elem.elementType}`));
          continue;
        }
        slide.appendChild(renderer(elem, deck));
      } catch (err) {
        warn(deck, "element", `元素 ${elem.elementId} 渲染失败: ${err.message}`);
        try { slide.appendChild(placeholder(elem, deck, `渲染失败: ${elem.elementId}`)); } catch { /* ignore */ }
      }
    }
    return slide;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ============================================================
   * 加载器：文件目录 / URL 参数 / IndexedDB 恢复
   * ============================================================ */

  function collectImageRefs(page) {
    const refs = new Set();
    (function walk(obj) {
      if (!obj || typeof obj !== "object") return;
      if ((obj.elementType === "image" || obj.type === "image") && typeof obj.src === "string" && !/^(https?:|data:)/.test(obj.src)) {
        refs.add(normalizeRel(obj.src));
      }
      for (const v of Object.values(obj)) walk(v);
    })(page);
    return refs;
  }

  function normalizeRel(p) {
    const parts = [];
    for (const seg of String(p).replaceAll("\\", "/").split("/")) {
      if (!seg || seg === ".") continue;
      if (seg === "..") parts.pop();
      else parts.push(seg);
    }
    return parts.join("/");
  }

  async function loadFromFileList(files) {
    const map = new Map();
    for (const f of files) map.set(normalizeRel(f.webkitRelativePath || f.name), f);
    const manifestKey = [...map.keys()].find((k) => k.endsWith(".pptd"));
    if (!manifestKey) throw new Error("所选文件夹中没有 .pptd 主文件");
    const base = manifestKey.split("/").slice(0, -1).join("/");

    const manifest = jsyaml.load(await map.get(manifestKey).text());
    const pages = [];
    for (const rel of manifest.pages || []) {
      const key = normalizeRel(rel);
      const full = base ? `${base}/${key}` : key;
      const f = map.get(full) || map.get(key);
      if (!f) throw new Error(`页面文件缺失: ${rel}`);
      pages.push(jsyaml.load(await f.text()));
    }
    // 图片 → blob URL
    const used = new Set();
    for (const p of pages) for (const r of collectImageRefs(p)) used.add(r);
    const images = {};
    for (const rel of used) {
      const full = base ? `${base}/${rel}` : rel;
      const f = map.get(full) || map.get(rel);
      if (f) images[rel] = URL.createObjectURL(f);
    }
    return { manifest, pages, images, name: manifest.title || manifestKey.split("/").pop(), path: manifestKey };
  }

  async function loadFromPath(deckPath) {
    // ?deck= 模式：fetch 读取（file:// 下需 Chrome 加 --allow-file-access-from-files）
    // 注意：deckPath 必须是 .pptd 主文件路径（file:// 下无法列目录）
    if (!/\.pptd\s*$/.test(deckPath)) {
      throw new Error(`?deck= 需要传 .pptd 主文件路径（当前: ${deckPath}）`);
    }
    const abs = deckPath.startsWith("/") ? `file://${deckPath}` : new URL(deckPath, location.href).href;
    const dir = abs.replace(/[^/]*$/, "");
    const manifestText = await (await fetch(abs)).text();
    const manifest = jsyaml.load(manifestText);
    const pages = [];
    for (const rel of manifest.pages || []) {
      const res = await fetch(new URL(rel, dir).href);
      if (!res.ok) throw new Error(`页面读取失败: ${rel}`);
      pages.push(jsyaml.load(await res.text()));
    }
    const used = new Set();
    for (const p of pages) for (const r of collectImageRefs(p)) used.add(r);
    const images = {};
    for (const rel of used) {
      const res = await fetch(new URL(rel, dir).href);
      if (res.ok) {
        const blob = await res.blob();
        const dataUrl = await new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onload = () => resolve(fr.result);
          fr.onerror = reject;
          fr.readAsDataURL(blob);
        });
        images[rel] = dataUrl;
      }
    }
    return { manifest, pages, images, name: manifest.title || deckPath.split("/").pop(), path: deckPath };
  }

  /* ---------- IndexedDB 缓存（恢复上次打开的 deck） ---------- */

  function openCache() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("pptd-viewer", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("decks");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveCache(deck) {
    try {
      const db = await openCache();
      const dataUrls = {};
      for (const [rel, blobUrl] of Object.entries(deck.images)) {
        dataUrls[rel] = await blobToDataURL(blobUrl);
      }
      const tx = db.transaction("decks", "readwrite");
      tx.objectStore("decks").put({ key: "last", name: deck.name, path: deck.path, manifest: deck.manifest, pages: deck.pages, images: dataUrls, ts: Date.now() }, "last");
    } catch { /* 缓存失败不阻断主流程 */ }
  }

  function blobToDataURL(url) {
    return fetch(url).then((r) => r.blob()).then((b) => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = reject;
      fr.readAsDataURL(b);
    }));
  }

  async function restoreCache() {
    try {
      const db = await openCache();
      const rec = await new Promise((resolve, reject) => {
        const req = db.transaction("decks").objectStore("decks").get("last");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return rec || null;
    } catch { return null; }
  }

  /* ============================================================
   * 播放器
   * ============================================================ */

  const $ = (id) => document.getElementById(id);

  function buildDeck(loaded) {
    uidSeq = 0;
    state.deck = { ...loaded, warnings: [] };
    state.slides = state.deck.pages.map((page) => renderPage(page, state.deck));

    const mount = $("slide-mount");
    mount.replaceChildren(...state.slides);

    const strip = $("thumb-strip");
    strip.replaceChildren();
    state.slides.forEach((slide, i) => {
      const thumb = el("div", "thumb");
      const clone = slide.cloneNode(true);
      clone.style.position = "absolute";
      clone.style.inset = "0";
      clone.style.display = "block";
      thumb.appendChild(clone);
      const no = el("span", "page-no", null);
      no.textContent = slide.dataset.pageType ? `${i + 1} · ${slide.dataset.pageType}` : `${i + 1}`;
      thumb.appendChild(no);
      thumb.addEventListener("click", () => goto(i));
      strip.appendChild(thumb);
    });

    $("deck-name").textContent = state.deck.name;
    $("deck-path").textContent = state.deck.path || "";
    $("hint").hidden = true;
    goto(0);
    checkFonts();
    renderWarnings();
  }

  function goto(i) {
    if (!state.deck) return;
    state.current = Math.max(0, Math.min(i, state.slides.length - 1));
    state.slides.forEach((s, idx) => { s.style.display = idx === state.current ? "block" : "none"; });
    document.querySelectorAll(".thumb").forEach((t, idx) => t.classList.toggle("current", idx === state.current));
    $("page-ind").textContent = `${state.current + 1} / ${state.slides.length}`;
    updateNotes();
    applyZoom();
  }

  function updateNotes() {
    const bar = $("notes-bar");
    if (!state.deck || !state.notesOn) { bar.hidden = true; return; }
    const notes = state.deck.pages[state.current].notes || "";
    bar.hidden = !notes;
    bar.textContent = notes ? `【第 ${state.current + 1} 页备注】\n${notes}` : "";
  }

  function applyZoom() {
    const stage = $("stage");
    let s;
    if (state.zoomMode === "fit") {
      const rect = stage.getBoundingClientRect();
      const [W, H] = state.deck?.manifest?.size || [960, 540];
      s = Math.min(rect.width / W, rect.height / H);
    } else {
      s = state.zoomMode / 100;
    }
    $("scaler").style.transform = `scale(${s})`;
  }

  function checkFonts() {
    const fonts = new Set();
    const scan = (obj) => {
      if (!obj || typeof obj !== "object") return;
      if (typeof obj.fontFamily === "string" && !obj.fontFamily.startsWith("$")) fonts.add(obj.fontFamily);
      if (obj.fontFamily && typeof obj.fontFamily === "object") { fonts.add(obj.fontFamily.latin); fonts.add(obj.fontFamily.ea); }
      for (const v of Object.values(obj)) scan(v);
    };
    scan(state.deck.manifest);
    for (const p of state.deck.pages) scan(p);
    document.fonts.ready.then(() => {
      for (const f of fonts) {
        if (f && !document.fonts.check(`12px "${f}"`)) {
          warn(state.deck, "font", `字体 "${f}" 未安装，浏览器将回退显示`);
        }
      }
      renderWarnings();
    });
  }

  function renderWarnings() {
    const ws = state.deck?.warnings || [];
    const btn = $("btn-warn");
    btn.hidden = ws.length === 0;
    $("warn-count").textContent = String(ws.length);
  }

  function showOverlay(title, rows) {
    $("overlay-title").textContent = title;
    const body = $("overlay-body");
    body.replaceChildren();
    if (!rows.length) body.textContent = "（无）";
    for (const r of rows) {
      const row = el("div", "w-row");
      row.innerHTML = `<span class="w-kind">[${escapeHtml(r.kind)}]</span> <span class="w-msg">${escapeHtml(r.msg)}</span>`;
      body.appendChild(row);
    }
    $("overlay").hidden = false;
  }

  /* ---------- 导出 PNG（SVG foreignObject 快照） ---------- */

  async function exportPNG() {
    if (!state.deck) return;
    const slide = state.slides[state.current];
    const [W, H] = state.deck.manifest.size || [960, 540];
    try {
      await Promise.all([...slide.querySelectorAll("img")].map((i) => i.decode().catch(() => {})));
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">` +
        `<foreignObject width="100%" height="100%">` +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px">${slide.innerHTML}</div>` +
        `</foreignObject></svg>`;
      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
      const canvas = el("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      const a = el("a", null, { display: "none" });
      a.download = `slide_${state.current + 1}.png`;
      a.href = canvas.toDataURL("image/png");
      document.body.appendChild(a);
      a.click();
      a.remove();
      setStatus(`已导出 slide_${state.current + 1}.png`);
    } catch (err) {
      setStatus(`导出失败: ${err.message}`);
    }
  }

  function setStatus(text) {
    $("status-line").textContent = text;
    clearTimeout(setStatus._t);
    setStatus._t = setTimeout(() => { $("status-line").textContent = ""; }, 5000);
  }

  /* ---------- 导出 HTML 文件夹（每页一个自包含 .html + index.html，ZIP 打包） ---------- */

  // 渲染必需的类样式（导出页嵌入；slide 元素样式本身全部内联）
  const RENDER_CSS = `
.slide { position: absolute; inset: 0; overflow: hidden; background: #fff; color: #000;
  font-family: MiSans, -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 18px; line-height: 1; }
.el { position: absolute; }
.el-text p, .el-cell p { margin: 0; }
.el-text ul, .el-text ol { margin: 0; padding-left: 1.4em; }
.el-placeholder { border: 1.5px dashed #c0392b; background: rgb(192 57 43 / 7%); color: #c0392b;
  font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; overflow: hidden; }
.el-bg { position: absolute; inset: 0; }`;

  const PAGE_SHELL_CSS = `
body { margin: 0; background: #eceff3; }
.wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
.stage { position: relative; flex: none; box-shadow: 0 4px 24px rgb(0 0 0 / 14%); }`;

  // index.html 全页拼接布局
  const INDEX_SHELL_CSS = `
body { margin: 0; background: #eceff3; }
.sections { display: flex; flex-direction: column; align-items: center; gap: 36px; padding: 36px 24px; box-sizing: border-box; }
.stage { position: relative; flex: none; box-shadow: 0 4px 24px rgb(0 0 0 / 14%); }`;

  /* ---- 极简 ZIP writer（store 模式 + CRC32 + UTF-8 文件名） ---- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function buildZip(files) {
    const enc = new TextEncoder();
    const locals = [], central = [];
    let offset = 0;
    for (const f of files) {
      const nameB = enc.encode(f.name);
      const data = f.data;
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true); // UTF-8 文件名
      lh.setUint16(8, 0, true);      // store（不压缩）
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nameB.length, true);
      locals.push(lh.buffer, nameB, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, nameB.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, nameB);
      offset += 30 + nameB.length + data.length;
    }
    const centralSize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, files.length, true);
    eocd.setUint16(10, files.length, true);
    eocd.setUint32(12, centralSize, true);
    eocd.setUint32(16, offset, true);
    return new Blob([...locals, ...central, eocd.buffer], { type: "application/zip" });
  }

  function safeName(name) {
    return String(name || "deck").replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 60) || "deck";
  }

  // 生成每页自包含 HTML 的完整文本（纯净单页：仅 slide 本体，无导航等附加元素）
  // 单个 slide → 自包含 HTML 片段（强制 display:block + 图片替换，DRY：单页与拼接页共用）
  async function buildSlideBody(slide, deck, dataUrlOf) {
    // 注意：非当前页 slide 带内联 display:none，克隆后强制 display:block
    const clone = slide.cloneNode(true);
    clone.style.display = "block";
    let html = clone.outerHTML;
    // blob URL → data URL（HTML 字符串全局替换，覆盖 img src 与 background-image）
    for (const [rel, url] of Object.entries(deck.images)) {
      const dataUrl = await dataUrlOf(url);
      html = html.split(url).join(dataUrl);
    }
    return html;
  }

  async function buildPageHTML(slide, i, deck, dataUrlOf) {
    const [W, H] = deck.manifest.size || [960, 540];
    const title = deck.manifest.title || deck.name || "PPT";
    const body = await buildSlideBody(slide, deck, dataUrlOf);
    return `<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 ${i + 1} 页 · ${escapeHtml(title)}</title>
<style>${RENDER_CSS}\n${PAGE_SHELL_CSS}</style>
</head>
<body>
<div class="wrap">
  <div class="stage" style="width:${W}px;height:${H}px">
    <div style="position:relative;width:${W}px;height:${H}px">${body}</div>
  </div>
</div>
</body>
</html>`;
  }

  // index.html = 全部页面纵向拼接的完整版（一滚到底看完整 deck）
  async function buildIndexHTML(deck, dataUrlOf) {
    const [W, H] = deck.manifest.size || [960, 540];
    const title = deck.manifest.title || deck.name || "PPT";
    const sections = [];
    for (let i = 0; i < deck.pages.length; i++) {
      const body = await buildSlideBody(state.slides[i], deck, dataUrlOf);
      sections.push(`  <div class="stage" style="width:${W}px;height:${H}px">
    <div style="position:relative;width:${W}px;height:${H}px">${body}</div>
  </div>`);
    }
    return `<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)} — 全部 ${deck.pages.length} 页</title>
<style>${RENDER_CSS}\n${INDEX_SHELL_CSS}</style>
</head>
<body>
<div class="sections">
${sections.join("\n")}
</div>
</body>
</html>`;
  }

  // 导出 ZIP（index.html + 每页 page_NN.html）
  async function exportHTMLBundle(deck) {
    const enc = new TextEncoder();
    const cache = new Map();
    const dataUrlOf = async (url) => {
      if (url.startsWith("data:")) return url;
      if (cache.has(url)) return cache.get(url);
      const dataUrl = await blobToDataURL(url);
      cache.set(url, dataUrl);
      return dataUrl;
    };
    const files = [
      { name: "index.html", data: enc.encode(await buildIndexHTML(deck, dataUrlOf)) },
    ];
    for (let i = 0; i < deck.pages.length; i++) {
      const slide = state.slides[i];
      const text = await buildPageHTML(slide, i, deck, dataUrlOf);
      files.push({ name: `page_${String(i + 1).padStart(2, "0")}.html`, data: enc.encode(text) });
    }
    return buildZip(files);
  }

  async function exportHTML() {
    if (!state.deck) return;
    try {
      setStatus("正在打包 HTML…");
      const zip = await exportHTMLBundle(state.deck);
      const a = el("a", null, { display: "none" });
      a.download = `${safeName(state.deck.name)}_html.zip`;
      a.href = URL.createObjectURL(zip);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setStatus(`已导出 ${a.download}（${state.slides.length} 个页面文件 + index.html，图片已内嵌）`);
    } catch (err) {
      setStatus(`HTML 导出失败: ${err.message}`);
    }
  }

  /* ---------- 事件 ---------- */

  $("btn-open").addEventListener("click", () => $("dir-picker").click());
  $("dir-picker").addEventListener("change", async (e) => {
    try {
      setStatus("正在加载…");
      const loaded = await loadFromFileList(e.target.files);
      buildDeck(loaded);
      saveCache(state.deck);
      setStatus(`已加载 ${loaded.name}（${state.slides.length} 页）`);
    } catch (err) {
      setStatus(`加载失败: ${err.message}`);
      alert(`加载失败: ${err.message}`);
    }
    e.target.value = "";
  });

  $("btn-thumbs").addEventListener("click", () => {
    state.thumbsOn = !state.thumbsOn;
    $("thumb-strip").classList.toggle("hidden", !state.thumbsOn);
    $("btn-thumbs").classList.toggle("active", state.thumbsOn);
    applyZoom();
  });
  for (const [id, mode] of [["btn-fit", "fit"], ["btn-100", 100], ["btn-150", 150]]) {
    $(id).addEventListener("click", () => {
      state.zoomMode = mode;
      document.querySelectorAll("#btn-fit,#btn-100,#btn-150").forEach((b) => b.classList.toggle("active", b.id === id));
      applyZoom();
    });
  }
  $("btn-notes").addEventListener("click", () => {
    state.notesOn = !state.notesOn;
    $("btn-notes").classList.toggle("active", state.notesOn);
    updateNotes();
  });
  $("btn-fullscreen").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  $("btn-png").addEventListener("click", exportPNG);
  $("btn-html").addEventListener("click", exportHTML);
  $("btn-warn").addEventListener("click", () => showOverlay("渲染告警", state.deck?.warnings || []));
  $("overlay-close").addEventListener("click", () => { $("overlay").hidden = true; });
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) $("overlay").hidden = true; });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight") goto(state.current + 1);
    else if (e.key === "ArrowLeft") goto(state.current - 1);
    else if (e.key === "f" || e.key === "F") $("btn-fullscreen").click();
    else if (e.key === "1") { state.zoomMode = "fit"; document.querySelectorAll("#btn-fit,#btn-100,#btn-150").forEach((b) => b.classList.toggle("active", b.id === "btn-fit")); applyZoom(); }
  });
  window.addEventListener("resize", applyZoom);

  /* ---------- 启动 ---------- */

  (async function boot() {
    const params = new URLSearchParams(location.search);
    if (params.get("bare")) {
      // 干净模式：隐藏 UI，slide 1:1 铺满窗口（用于截图/对比）
      document.body.classList.add("bare-mode");
    }
    if (params.get("deck")) {
      try {
        setStatus("正在从路径加载…");
        const loaded = await loadFromPath(params.get("deck"));
        buildDeck(loaded);
        if (params.get("page")) goto(parseInt(params.get("page"), 10) - 1);
        setStatus(`已加载 ${loaded.name}（${state.slides.length} 页）`);
        if (params.get("export-test")) {
          // 测试钩子：导出 ZIP → base64 写入隐藏 div，供 headless dump-dom 提取验证
          try {
            const zip = await exportHTMLBundle(loaded);
            const bytes = new Uint8Array(await zip.arrayBuffer());
            let bin = "";
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            const div = document.createElement("div");
            div.id = "export-test-out";
            div.hidden = true;
            div.textContent = btoa(bin);
            document.body.appendChild(div);
          } catch (err) {
            setStatus(`export-test 失败: ${err.message}`);
          }
        }
      } catch (err) {
        setStatus(`路径加载失败: ${err.message}`);
        $("hint").innerHTML = `<b>路径加载失败</b><br/>${escapeHtml(err.message)}<br/>file:// 协议下需以 <kbd>--allow-file-access-from-files</kbd> 启动 Chrome，或点击「打开文件夹」`;
      }
      return;
    }
    const cached = await restoreCache();
    if (cached && cached.manifest && cached.pages) {
      buildDeck({ manifest: cached.manifest, pages: cached.pages, images: cached.images, name: cached.name, path: cached.path });
      setStatus(`已恢复上次打开的演示文稿「${cached.name}」，可重新选择文件夹切换`);
    }
  })();
})();
</script>
</body>
</html>
