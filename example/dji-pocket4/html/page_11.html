r: rgb(142, 142, 150); letter-spacing: 3px; font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><p>DJI OSMO POCKET 4</p></div></div></div><div class="el el-text" style="left: 856px; top: 510px; width: 72px; height: 12px; font-size: 9px; color: rgb(142, 142, 150); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:right;"><p>11 / 18</p></div></div></div><div class="el el-text" style="left: 48px; top: 88px; width: 400px; height: 14px; font-size: 10px; color: rgb(217, 164, 65); letter-spacing: 3px; font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><p>智能与操控 SMART &amp; CONTROL</p></div></div></div><div class="el el-text" style="left: 48px; top: 116px; width: 460px; height: 52px; font-size: 36px; color: rgb(242, 240, 234); line-height: 1.35; font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><strong>轻转屏幕，即刻开拍</strong></div></div></div><div class="el el-text" style="left: 48px; top: 180px; width: 420px; height: 74px; font-size: 13px; color: rgb(142, 142, 150); line-height: 1.75; font-family: undefined;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:top;text-align:left;"><p>三轴云台随旋屏即刻响应，横竖拍无缝切换；2.0 英寸 OLED 触控屏，1000 尼特亮度，阳光下依然清晰可见。</p></div></div></div><div class="el el-text" style="left: 48px; top: 272px; width: 400px; height: 22px; font-size: 15px; color: rgb(242, 240, 234); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><strong>屏下双按键</strong></div></div></div><div class="el el-text" style="left: 48px; top: 298px; width: 420px; height: 16px; font-size: 11px; color: rgb(142, 142, 150); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><p>变焦键单击切换 1×/2×、双击 4×；自定义键长按触发预设</p></div></div></div><div class="el" style="left: 48px; top: 326px; width: 420px; height: 1px; background: rgb(42, 42, 49);"></div><div class="el el-text" style="left: 48px; top: 348px; width: 400px; height: 22px; font-size: 15px; color: rgb(242, 240, 234); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><strong>五维摇杆</strong></div></div></div><div class="el el-text" style="left: 48px; top: 374px; width: 420px; height: 16px; font-size: 11px; color: rgb(142, 142, 150); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><p>单击返回菜单，双击云台回中，三击切换前后镜头朝向</p></div></div></div><div class="el" style="left: 48px; top: 402px; width: 420px; height: 1px; background: rgb(42, 42, 49);"></div><div class="el el-text" style="left: 48px; top: 424px; width: 400px; height: 22px; font-size: 15px; color: rgb(242, 240, 234); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><strong>旋转屏开拍</strong></div></div></div><div class="el el-text" style="left: 48px; top: 450px; width: 420px; height: 16px; font-size: 11px; color: rgb(142, 142, 150); font-family: undefined; white-space: nowrap;"><div style="display:table;width:100%;height:100%"><div style="display:table-cell;vertical-align:middle;text-align:left;"><p>轻转屏幕云台即刻响应，竖拍横拍随心切换</p></div></div></div></div></div>
